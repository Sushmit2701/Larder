<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larder">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">Larder</h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-view="pantry" aria-selected="true">Pantry <span class="count" id="count-pantry">0</span></button>
      <button class="tab" role="tab" data-view="shopping" aria-selected="false">Shopping <span class="count" id="count-shopping">0</span></button>
      <button class="tab" role="tab" data-view="recipes" aria-selected="false">Recipes <span class="count" id="count-recipes">0</span></button>
      <button class="tab" role="tab" data-view="today" aria-selected="false">Today</button>
    </nav>
  </div>
</header>

<main id="main" class="wrap"></main>

<footer class="wrap foot">
  <p>Saved in this browser only. Nothing leaves your device.</p>
</footer>

<dialog id="editor" aria-label="Item details"></dialog>
<dialog id="importer" aria-label="Paste a list"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/logic.js"></script>
<script src="js/storage.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
